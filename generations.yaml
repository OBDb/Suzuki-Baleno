generations:
  - name: "First Generation"
    start_year: 2015
    end_year: 2019
    description: "The first-generation Suzuki Baleno is a subcompact hatchback produced from September 2015, built on Suzuki's new HEARTECT B platform. Unveiled at the 66th IAA Frankfurt Motor Show on 15 September 2015, it was previewed by the iK-2 concept car shown at the Geneva Motor Show in March 2015. Unlike previous Baleno models which were sedans and wagons, this generation is exclusively a 5-door hatchback. Engine options varied by market including a 1.0-liter Boosterjet turbocharged three-cylinder producing approximately 111 horsepower, a 1.2-liter Dualjet four-cylinder with approximately 90 horsepower, and a 1.4-liter naturally aspirated four-cylinder. A mild hybrid SHVS (Smart Hybrid Vehicle by Suzuki) system was available on some variants. Transmission options included five-speed manual, six-speed automatic, and CVT depending on market. The interior offered class-leading passenger space with a 7-inch touchscreen infotainment system on higher trims featuring Apple CarPlay and Android Auto. Safety features included six airbags, ABS with EBD, electronic stability program, and available autonomous emergency braking. The Baleno was marketed as a spacious alternative to the Swift, positioned above it in Suzuki's global lineup. Production took place in India at Maruti Suzuki's Manesar and Ahmedabad plants for global markets including Europe, Japan, Australia, and Asia."

  - name: "First Generation (Facelift)"
    start_year: 2019
    end_year: 2022
    description: "The facelifted first-generation Baleno was launched in India on 28 January 2019, introducing significant exterior and interior updates while retaining the same HEARTECT B platform. The exterior received a remodeled front bumper with a new grille design and new 16-inch alloy wheels with dual-tone coloring. The interior was upgraded with a dual-tone black-and-blue color scheme, and improvements were made to noise reduction and ride comfort. The Baleno RS performance variant was discontinued in January 2020 due to emission standards non-compliance. A new 1.2-liter K12N Dualjet dual-injector petrol engine with mild hybrid technology producing approximately 90 horsepower was introduced in April 2019, available for Delta and Zeta trims without CVT option. The 1.25-liter turbodiesel engine was discontinued in May 2020 due to stricter emission standards. The facelifted model was not available in Europe, Japan, and several other markets after Suzuki decided to discontinue the Baleno in those regions in 2020 to focus on the more popular Swift. Toyota began selling the facelifted Baleno as the Glanza in India from June 2019. Despite these updates, this remained the same WB1 platform generation."

  - name: "Second Generation"
    start_year: 2022
    end_year: null
    description: "The second-generation Suzuki Baleno hatchback was released in India on 23 February 2022, marketed as the 'New Age Baleno.' While continuing to use Suzuki's HEARTECT platform, it features major body shell revisions with new exterior panels, headlights, LED fog lights, tail lights, smaller C-pillar window, and redesigned wheels. The interior received a complete redesign with a floating 9-inch LCD display, new gauge cluster, refreshed steering wheel, rear air conditioning vents, fast charging USB ports, head-up display, 360-degree view camera, and Amazon Alexa voice assistant support. Handling was improved with an all-new suspension system, new hydraulic clutch, and larger front disc brakes. Engine options include a 1.2-liter K12N Dualjet petrol engine producing approximately 90 horsepower, with a CNG variant introduced in October 2022 for the Indian market. Transmission options include a 5-speed manual or new 5-speed AMT 'AGS' automatic which replaced the previous CVT. Export markets receive a larger 1.5-liter K15B petrol engine. Safety features were enhanced with up to 6 airbags, electronic stability control, and the model achieved a 4-star rating in Bharat NCAP (2025). Toyota continues to sell the Baleno-based Glanza with differentiated styling. Production continues in India for export to Asia, Africa, Middle East, and Latin America."